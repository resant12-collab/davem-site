<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>DAVEM — Painel de Fotos</title>
  <style>
    /* ── Identidade visual DAVEM ── */
    :root {
      --davem-blue:      #0d2244;
      --davem-blue-dark: #0a1628;
      --davem-blue-mid:  #1a3a6e;
      --davem-red:       #c8151b;
      --davem-red-dark:  #a01015;
    }

    /* Barra superior */
    [class*="AppHeader"] {
      background-color: var(--davem-blue) !important;
      background-image: none !important;
    }
    [class*="AppHeaderNavLink"],
    [class*="AppHeaderSiteLink"],
    [class*="AppHeaderButton"] {
      color: #fff !important;
    }
    [class*="AppHeaderNavLink"]:hover,
    [class*="AppHeaderButton"]:hover {
      background-color: var(--davem-blue-mid) !important;
    }
    [class*="AppHeaderQuickNewButton"] {
      background-color: var(--davem-red) !important;
      color: #fff !important;
    }
    [class*="AppHeaderQuickNewButton"]:hover {
      background-color: var(--davem-red-dark) !important;
    }

    /* Menu lateral das categorias */
    [class*="SidebarNavLink"][class*="active"],
    [class*="SidebarNavLink"].active {
      background-color: var(--davem-blue) !important;
      color: #fff !important;
    }
    [class*="SidebarHeading"] {
      color: var(--davem-blue) !important;
    }

    /* Botão Publicar */
    [class*="PublishButton"],
    [class*="PublishedButton"] {
      background-color: var(--davem-red) !important;
      color: #fff !important;
    }
    [class*="PublishButton"]:hover,
    [class*="PublishedButton"]:hover {
      background-color: var(--davem-red-dark) !important;
    }

    /* Tela de login */
    [class*="AuthForm"] [class*="LoginButton"],
    section[class*="css-"] button[class*="LoginButton"] {
      background-color: var(--davem-red) !important;
      color: #fff !important;
    }

    /* Miniatura da foto no formulário */
    [class*="ImageWrapper"] img,
    [class*="StyledImage"] {
      max-width: 100% !important;
      max-height: 340px !important;
      width: auto !important;
      height: auto !important;
      object-fit: contain !important;
      border-radius: 6px;
    }
    [class*="ImageWrapper"] {
      max-width: 480px !important;
      height: auto !important;
    }

    /* Logo da DAVEM na barra superior do painel */
    [class*="AppHeaderContent"]::before {
      content: "";
      display: inline-block;
      width: 92px;
      height: 40px;
      margin-right: 14px;
      background: url("/logo.png") left center / contain no-repeat;
      flex: none;
    }
    [class*="AppHeaderContent"] {
      display: flex !important;
      align-items: center;
    }
  </style>
</head>
<body>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://unpkg.com/decap-cms@^3.3.3/dist/decap-cms.js"></script>
  <script>
    /* Limita o tamanho das fotos no painel de pré-visualização (lado direito) */
    CMS.registerPreviewStyle(`
      body {
        font-family: -apple-system, Segoe UI, Roboto, sans-serif;
        padding: 16px;
        margin: 0;
        overflow-x: hidden;
      }
      img {
        display: block;
        max-width: 100%;
        max-height: 260px;
        width: auto;
        height: auto;
        object-fit: contain;
        border-radius: 6px;
        margin: 8px 0;
        background: #f2f2f2;
      }
      * { max-width: 100%; box-sizing: border-box; }
    `, { raw: true });
  </script>
</body>
</html>
