<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>DAVEM — Painel de Fotos</title>
  <style>
    /* Miniatura da foto no formulário */
    [class*="ImageWrapper"] img,
    [class*="StyledImage"] {
      max-width: 100% !important;
      max-height: 340px !important;
      width: auto !important;
      height: auto !important;
      object-fit: contain !important;
      border-radius: 6px;
    }
    [class*="ImageWrapper"] {
      max-width: 480px !important;
      height: auto !important;
    }
  </style>
</head>
<body>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://unpkg.com/decap-cms@^3.3.3/dist/decap-cms.js"></script>
  <script>
    /* Limita o tamanho das fotos no painel de pré-visualização (lado direito) */
    CMS.registerPreviewStyle(`
      body {
        font-family: -apple-system, Segoe UI, Roboto, sans-serif;
        padding: 16px;
        margin: 0;
        overflow-x: hidden;
      }
      img {
        display: block;
        max-width: 100%;
        max-height: 260px;
        width: auto;
        height: auto;
        object-fit: contain;
        border-radius: 6px;
        margin: 8px 0;
        background: #f2f2f2;
      }
      * { max-width: 100%; box-sizing: border-box; }
    `, { raw: true });
  </script>
</body>
</html>
