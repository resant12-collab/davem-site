backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

locale: "pt"

collections:
  - name: "guardacorpo"
    label: "Guarda Corpo"
    label_singular: "Guarda Corpo"
    files:
      - name: "fotos"
        label: "Fotos — Guarda Corpo"
        file: "galeria/guardacorpo.json"
        fields:
          - name: "itens"
            label: "Fotos"
            label_singular: "Foto"
            widget: "list"
            collapsed: true
            add_to_top: true
            summary: "{{fields.titulo}}"
            fields:
              - { name: "imagem",    label: "Foto",      widget: "image" }
              - { name: "titulo",    label: "Título",    widget: "string", default: "Guarda Corpo em Vidro" }
              - { name: "subtitulo", label: "Descrição", widget: "string", default: "Projeto Residencial", required: false }

  - name: "corrimao"
